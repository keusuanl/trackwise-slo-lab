groups:
  - name: trackwise_sli
    rules:
      - record: trackwise:availability:ratio_5m
        expr: avg_over_time(probe_success{job="trackwise_probe"}[5m])
      - record: trackwise:availability:ratio_6h
        expr: avg_over_time(probe_success{job="trackwise_probe"}[6h])
      - record: trackwise:error_budget:remaining_6h
        expr: 1 - ((1 - trackwise:availability:ratio_6h) / 0.001)

  - name: trackwise_burn
    rules:
      - record: trackwise:burn_rate:5m
        expr: (1 - avg_over_time(probe_success{job="trackwise_probe"}[5m])) / 0.001
      - record: trackwise:burn_rate:1m
        expr: (1 - avg_over_time(probe_success{job="trackwise_probe"}[1m])) / 0.001
      - alert: TrackWiseFastBurn
        expr: trackwise:burn_rate:5m > 14.4 and trackwise:burn_rate:1m > 14.4
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "TrackWise is burning error budget more than 14x too fast"

      - alert: TrackWiseProbeMissing
        expr: absent(probe_success{job="trackwise_probe"}) or up{job="trackwise_probe"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "No probe data: the monitoring itself may be broken"