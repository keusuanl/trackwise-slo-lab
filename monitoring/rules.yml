groups:
  - name: trackwise_sli
    rules:
      - record: trackwise:availability:ratio_5m
        expr: avg_over_time(probe_success{job="trackwise_probe"}[5m])
      - record: trackwise:availability:ratio_6h
        expr: avg_over_time(probe_success{job="trackwise_probe"}[6h])
      - record: trackwise:error_budget:remaining_6h
        expr: 1 - ((1 - trackwise:availability:ratio_6h) / 0.001)
