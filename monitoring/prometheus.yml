global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9091"]   # adjust if your Prometheus listens on a different port

  - job_name: node-infra
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: node-control
    static_configs:
      - targets: ["control01:9100"]

  - job_name: trackwise
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control01:8080"]

  - job_name: trackwise_probe
    scrape_interval: 5s
    metrics_path: /probe
    params:
      module: [http_trackwise]
    static_configs:
      - targets: ['http://control01:8080/v1/track']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
