global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9091"]   # adjust if your Prometheus listens on a different port

  - job_name: node-infra
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: node-control
    static_configs:
      - targets: ["control01:9100"]

  - job_name: trackwise
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control01:8080"]
